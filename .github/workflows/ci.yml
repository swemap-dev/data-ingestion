name: data-ingestion-ci

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  test-db-and-webhook:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Initialize Database
        env:
          PGPASSWORD: test_password
        run: |
          psql -h localhost -U postgres -d test_db -f db_schema/create_tables.sql
          psql -h localhost -U postgres -d test_db -f db_schema/init.sql

      - name: Run Tests
        env:
          DB_DSN: postgresql://postgres:test_password@localhost:5432/test_db
        run: |
          pytest tests/