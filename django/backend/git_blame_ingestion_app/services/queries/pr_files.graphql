query PRFiles($owner: String!, $repo: String!, $number: Int!, $first: Int!, $after: String) {
  repository(owner: $owner, name: $repo) {
    pullRequest(number: $number) {
      files(first: $first, after: $after) {
        nodes {
          path
        }
        pageInfo {
          hasNextPage
          endCursor
        }
      }
    }
  }
}