query MergedPRs($owner: String!, $repo: String!, $first: Int!, $after: String) {
  repository(owner: $owner, name: $repo) {
    pullRequests(
      states: [MERGED]
      first: $first
      after: $after
      orderBy: { field: UPDATED_AT, direction: DESC }
    ) {
      totalCount
      nodes {
        number
        title
        url
        createdAt
        updatedAt
        mergedAt
        mergedBy {
          login
        }
        author {
          login
        }
        baseRefName
        headRefName
        additions
        deletions
        changedFiles
        mergeCommit {
          oid
        }
      }
      pageInfo {
        hasNextPage
        endCursor
      }
    }
  }
}
