services:
    redis:
      image: redis
      ports:
        - "6379:6379"
    redisinsight:
      image: redis/redisinsight:latest
      ports:
        - "5540:5540"
      volumes:
        - redisinsight_data:/data
      environment:
        - RI_REDIS_HOST=redis
        - RI_REDIS_PORT=6379
volumes:
  redisinsight_data: