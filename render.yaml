services:
  # 1. Managed Redis (Key-Value)
  - type: redis
    name: swemap-redis
    ipAllowList: []
    plan: free

  # 2. Django Web Service + Celery (Combined for $0 tier)
  - type: web
    name: swemap-web
    env: python
    plan: free
    buildCommand: "./django/backend/build.sh"
    # We run Celery in the background (&) and Gunicorn in the foreground!
    # Because & separates commands, we must use --chdir for gunicorn to find the code
    # We MUST use threads instead of prefork to stay under 512MB RAM, while still getting high concurrency!
    startCommand: "cd django/backend && celery -A backend worker -B --pool=threads --concurrency=4 -l info & gunicorn --chdir django/backend backend.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        sync: false
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: swemap-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: swemap-redis
          property: connectionString
      - key: GITHUB_TOKEN
        sync: false
      - key: OLLAMA_BASE_URL
        value: "PLACEHOLDER_FOR_FUTURE_LLM_URL"
