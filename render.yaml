databases:
  - name: swemap-db
    databaseName: swemap
    user: swemap_user
    plan: free

services:
  # 1. Managed Redis (Key-Value)
  - type: redis
    name: swemap-redis
    ipAllowList: []
    plan: free

  # 2. Django Web Service
  - type: web
    name: swemap-web
    env: python
    plan: free
    buildCommand: "./django/backend/build.sh"
    startCommand: "cd django/backend && gunicorn backend.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: swemap-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: swemap-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: swemap-redis
          property: connectionString
      - key: GITHUB_TOKEN
        sync: false
      - key: OLLAMA_BASE_URL
        value: "PLACEHOLDER_FOR_FUTURE_LLM_URL"

  # 3. Celery Worker + Beat (Combined to save money)
  - type: worker
    name: swemap-celery-worker
    env: python
    # Render doesn't offer free background workers, so this will be the cheapest tier (~$7/mo)
    plan: starter 
    buildCommand: "./django/backend/build.sh"
    # Notice the -B flag! This runs Beat and Worker in the exact same container.
    startCommand: "cd django/backend && celery -A backend worker -B -l info"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: swemap-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: swemap-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: swemap-redis
          property: connectionString
      - key: GITHUB_TOKEN
        sync: false
      - key: OLLAMA_BASE_URL
        value: "PLACEHOLDER_FOR_FUTURE_LLM_URL"
